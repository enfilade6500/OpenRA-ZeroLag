name: ZeroLag release build

# Builds the server DLL the way the release is built (Release configuration, .NET 6 SDK) and
# attaches it, with its SHA-256, to the GitHub release for a "zerolag-v*" tag. Can also be run
# by hand from the Actions tab to get the DLL as a workflow artifact without making a release.
on:
  push:
    tags: [ 'zerolag-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OpenRA.Game.dll (Release)
    runs-on: ubuntu-22.04

    steps:
      - name: Remove System .NET
        run: sudo apt-get remove -y dotnet*

      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir -p dist
          cp bin/OpenRA.Game.dll dist/
          cp SERVER-INSTALL.md dist/
          (cd dist && sha256sum OpenRA.Game.dll > OpenRA.Game.dll.sha256 && cat OpenRA.Game.dll.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerolag-server-${{ github.ref_name }}
          path: dist/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/zerolag-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#zerolag-}"
          notes="Server-side build of ZeroLag ${version} for OpenRA release-20250330. Replace your server's OpenRA.Game.dll with this one (see SERVER-INSTALL.md); players need nothing."
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac   # v2.6-rc1 and the like
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "ZeroLag Server ${version}" --notes "$notes" --generate-notes --verify-tag $prerelease
          gh release upload "$GITHUB_REF_NAME" dist/OpenRA.Game.dll dist/OpenRA.Game.dll.sha256 dist/SERVER-INSTALL.md --clobber
